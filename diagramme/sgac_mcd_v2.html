<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGAC – MCD v2</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f8f7f4; color: #1a1a18; padding: 2rem; }
  h1 { font-size: 1.2rem; font-weight: 500; margin-bottom: 0.25rem; color: #1a1a18; }
  p.sub { font-size: 0.85rem; color: #73726c; margin-bottom: 1.5rem; }
  #erd { background: #fff; border: 1px solid #e0ded6; border-radius: 12px; padding: 1.5rem; }
  @media (prefers-color-scheme: dark) {
    body { background: #1a1a18; color: #e0ded6; }
    h1 { color: #e0ded6; }
    #erd { background: #242420; border-color: #3a3a36; }
  }
</style>
</head>
<body>
<h1>SGAC — Modèle Conceptuel de Données (v2)</h1>
<p class="sub">Projet: securit-afrique-hub-main · SGBD: PostgreSQL · ORM: Prisma · 2026-02-27</p>
<div id="erd"></div>

<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: 'system-ui, sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: 'system-ui, sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});

const { svg } = await mermaid.render('erd-svg', `erDiagram
    USERS {
        uuid id PK
        string username
        string email
        boolean isActive
    }
    PROFILES {
        uuid id PK
        uuid userId FK
        string firstName
        string lastName
        string grade
        timestamp deletedAt
    }
    ROLES {
        uuid id PK
        string name
        json permissions
    }
    USER_ROLES {
        uuid id PK
        uuid userId FK
        uuid roleId FK
    }
    CRIME_TYPES {
        uuid id PK
        string name
        string code
        string severity
    }
    CRIMINALS {
        uuid id PK
        string caseNumber
        uuid crimeTypeId FK
        uuid createdById FK
        string status
        string dangerLevel
        timestamp deletedAt
    }
    CRIMES {
        uuid id PK
        uuid criminalId FK
        uuid crimeTypeId FK
        uuid createdById FK
        string status
        string dangerLevel
        timestamp crimeDate
    }
    ARRESTATIONS {
        uuid id PK
        uuid criminalId FK
        uuid createdById FK
        string warrantNumber
    }
    EVIDENCES {
        uuid id PK
        uuid criminalId FK
        uuid createdById FK
        text_array fileUrls
    }
    AUDIT_LOGS {
        uuid id PK
        uuid userId FK
        string action
        string entity
        json changes
        timestamp timestamp
    }

    USERS ||--o| PROFILES : "a"
    USERS ||--o{ USER_ROLES : "assigné"
    ROLES ||--o{ USER_ROLES : "contient"
    CRIME_TYPES ||--o{ CRIMINALS : "classifie"
    CRIME_TYPES ||--o{ CRIMES : "catégorise"
    CRIMINALS ||--o{ CRIMES : "enregistre"
    USERS ||--o{ CRIMES : "crée"
    USERS ||--o{ CRIMINALS : "crée"
    CRIMINALS ||--o| ARRESTATIONS : "a"
    USERS ||--o{ ARRESTATIONS : "enregistre"
    CRIMINALS ||--o{ EVIDENCES : "possède"
    USERS ||--o{ EVIDENCES : "soumet"
    USERS ||--o{ AUDIT_LOGS : "génère"
`);

document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
</body>
</html>
